# Builds OpenDeck-Setup-<version>.exe on GitHub's Windows machines with scripts/build.ps1
# (frontend, tests, PyInstaller, Inno Setup), the same script developers run locally.
#
#   Every push to main, every pull request, or "Run workflow" on the Actions tab:
#     the installer is attached to the run as an artifact (download it from the run's page).
#   Pushing a tag v<version> (for example v1.1.0, matching backend/opendeck/__init__.py):
#     also publishes a GitHub Release with the installer.

name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip the frontend and backend tests (faster)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python environment
        shell: powershell
        run: python -m venv .venv  # build.ps1 reuses it instead of looking for the py launcher

      - name: Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build
        shell: powershell
        run: |
          $flags = @()
          if ("${{ inputs.skip_tests }}" -eq "true") { $flags += "-SkipTests" }
          powershell -ExecutionPolicy Bypass -File scripts\build.ps1 @flags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $version = (Select-String -Path backend\opendeck\__init__.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version in backend/opendeck/__init__.py"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: OpenDeck-Setup
          path: dist/installer/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenDeck-Setup
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.exe"
          generate_release_notes: true
